name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      APP_ENV: testing
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      BCRYPT_ROUNDS: 4
      CACHE_DRIVER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, intl, mbstring, pdo_sqlite

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP platform requirements
        run: composer check-platform-reqs

      - name: Check formatting of changed PHP files
        if: matrix.php == '8.2'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          mapfile -t php_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.php')

          if (( ${#php_files[@]} > 0 )); then
            vendor/bin/pint --test "${php_files[@]}"
          else
            echo "No changed PHP files to format-check."
          fi

      - name: Run PHP tests
        run: php -d max_execution_time=0 artisan test

      - name: Verify workflow runtime fingerprint
        if: matrix.php == '8.2'
        shell: bash
        run: |
          expected="$(tr -d '\r\n[:space:]' < workflow-runtime.sha256)"
          php artisan workflow:runtime-hash --expect="$expected"
          php artisan workflow:runtime-hash --json --files > workflow-runtime-hashes.json

      - name: Upload workflow runtime fingerprint
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-runtime-hashes
          path: workflow-runtime-hashes.json
          if-no-files-found: error

  mysql:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      BCRYPT_ROUNDS: 4
      CACHE_DRIVER: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: followflow_test
      DB_USERNAME: root
      DB_PASSWORD: root
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: followflow_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, dom, fileinfo, intl, mbstring, pdo_mysql

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run migrations on MySQL
        run: php artisan migrate --force

      - name: Run PHP tests on MySQL
        run: php -d max_execution_time=0 artisan test

  node:
    name: Node and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node orchestration and workflow runtime tests
        run: npm run test:node

      - name: Build and verify Vite assets
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Audit locked Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Audit locked Node dependencies
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
