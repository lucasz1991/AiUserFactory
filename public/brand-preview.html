<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>FollowFlow Brand Preview</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f8; color: #1b1230; }
  section { padding: 26px 32px; }
  .dark { background: #150e26; color: #fff; }
  h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .55; margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .cap { font-size: 11px; opacity: .5; text-align: center; margin-top: 6px; }
  figure { margin: 0; }
</style>
</head>
<body>
<section>
  <h2>Zeichen SVG</h2>
  <div class="row">
    <figure><img src="/site-images/brand/followflow-mark.svg" width="160" height="160"><div class="cap">160</div></figure>
    <figure><img src="/site-images/brand/followflow-mark.svg" width="64" height="64"><div class="cap">64</div></figure>
    <figure><img src="/site-images/brand/followflow-mark.svg" width="36" height="36"><div class="cap">36 Topbar</div></figure>
    <figure><img src="/favicon.svg" width="32" height="32"><div class="cap">favicon 32</div></figure>
    <figure><img src="/favicon.svg" width="16" height="16"><div class="cap">favicon 16</div></figure>
    <figure><img src="/site-images/brand/followflow-mark-plain.svg" width="96" height="96"><div class="cap">ohne Badge</div></figure>
  </div>
</section>
<section>
  <h2>Schriftlogo hell</h2>
  <div class="row">
    <img src="/site-images/brand/followflow-logo.svg" height="72">
    <img src="/site-images/brand/followflow-logo.svg" height="44">
    <img src="/site-images/brand/followflow-logo.svg" height="28">
  </div>
</section>
<section class="dark">
  <h2>Schriftlogo dunkel</h2>
  <div class="row">
    <img src="/site-images/brand/followflow-logo-light.svg" height="72">
    <img src="/site-images/brand/followflow-logo-light.svg" height="44">
    <img src="/site-images/brand/followflow-mark-plain.svg" width="64" height="64">
  </div>
</section>
<section>
  <h2>Animiertes Icon GIF</h2>
  <div class="row">
    <figure><img src="/site-images/brand/followflow-mark-animated.gif" width="160" height="160" style="border-radius:28%"><div class="cap">160</div></figure>
    <figure><img src="/site-images/brand/followflow-mark-animated.gif" width="64" height="64" style="border-radius:28%"><div class="cap">64</div></figure>
    <figure><img src="/site-images/brand/followflow-mark-animated.gif" width="36" height="36" style="border-radius:28%"><div class="cap">36</div></figure>
  </div>
</section>
<section>
  <h2>PNG Raster</h2>
  <div class="row">
    <figure><img src="/icons/pwa-192.png" width="96"><div class="cap">pwa-192</div></figure>
    <figure><img src="/icons/pwa-maskable-512.png" width="96"><div class="cap">maskable</div></figure>
    <figure><img src="/site-images/favicon/favicon-32x32.png" width="32"><div class="cap">32</div></figure>
    <figure><img src="/site-images/favicon/favicon-16x16.png" width="16"><div class="cap">16</div></figure>
    <figure style="background:#150e26;padding:8px"><img src="/icons/push-badge-96.png" width="48"><div class="cap" style="color:#fff">push badge</div></figure>
    <figure><img src="/site-images/brand/followflow-logo.png" height="48"><div class="cap">logo.png</div></figure>
  </div>
</section>
</body>
</html>
